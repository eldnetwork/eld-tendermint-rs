name: image

on:
  push:
    tags:
      - v0.34.24-eld-tm-rs.*
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# CI jobs only read the repo. The image job grants packages: write.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    # A custom if replaces the default success() check. Keep success() so a
    # failed CI job cannot publish. workflow_dispatch stays in CI only.
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.34.24-eld-tm-rs.')
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}/eld-tendermint-rs" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{raw}}
            type=sha
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record image digest
        run: |
          {
            echo "### Image"
            echo "ref: ${{ github.ref_name }}"
            echo "tags: ${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
