# Supply-chain policy. CI runs `cargo deny check advisories bans licenses sources`.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# "none" keeps unmaintained notices from failing CI.
# Vulnerabilities and yanked crates still fail.
unmaintained = "none"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "deny"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = []
# Older copies kept by rand 0.8, tungstenite, or the RocksDB build.
# Skipping the stale version leaves one copy, so a new duplicate still fails CI.
skip = [
    { crate = "getrandom@0.2.17", reason = "rand 0.8 used by ed25519-dalek and the p2p handshake" },
    { crate = "getrandom@0.3.4", reason = "rand 0.9 pulled by tungstenite" },
    { crate = "itertools@0.13.0", reason = "bindgen via librocksdb-sys" },
    { crate = "r-efi@5.3.0", reason = "getrandom 0.2" },
    { crate = "rand@0.8.8", reason = "ed25519-dalek and the p2p handshake" },
    { crate = "rand_chacha@0.3.1", reason = "rand 0.8" },
    { crate = "rand_core@0.6.4", reason = "rand 0.8" },
    { crate = "shlex@1.3.0", reason = "bindgen via librocksdb-sys" },
    { crate = "syn@2.0.119", reason = "kept beside syn 3 by proc-macro crates" },
]
skip-tree = [
    { crate = "windows-sys", reason = "windows-sys and its targets bump independently across crates" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
