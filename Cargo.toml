[workspace]
resolver = "2"
members = [
    "crates/abci",
    "crates/blockchain",
    "crates/config",
    "crates/consensus",
    "crates/crypto",
    "crates/evidence",
    "crates/mempool",
    "crates/node",
    "crates/p2p",
    "crates/privval",
    "crates/proto",
    "crates/state",
    "crates/store",
    "crates/types",
    "tools/proto-compiler",
]

[workspace.package]
authors = ["Eld network"]
edition = "2024"
rust-version = "1.86.0"
license = "Apache-2.0"
repository = "https://github.com/eldnetwork/eld-tendermint-rs"
homepage = "https://github.com/eldnetwork/eld-tendermint-rs"

[workspace.lints.rust]
warnings = "deny"
# Production code has no `unsafe`. `crates/config` lists its own lints and
# denies `unsafe_code`, so the hostname FFI and the `TMHOME` test can allow
# the one block they need. RocksDB is called only from `crates/store/src/db.rs`;
# its FFI stays in the `rocksdb` crate. `eld-tendermint unsafe-reset-all` is
# the CLI name for wiping chain data. It is tested in `crates/node/tests/status.rs`.
unsafe_code = "forbid"

# Denied outside tests. `clippy.toml` allows unwrap, expect, and dbg! in test code.
# `todo!` stays denied everywhere. rustfmt uses its defaults; there is no rustfmt.toml.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
