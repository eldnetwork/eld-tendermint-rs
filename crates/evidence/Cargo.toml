[package]
name = "eld-tendermint-evidence"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Tendermint 0.34 evidence pool. Checks duplicate votes and light-client attacks, stores them, and gossips them on channel 0x38."
readme = "README.md"
documentation = "https://github.com/eldnetwork/eld-tendermint-rs/blob/main/crates/evidence/README.md"
keywords = ["tendermint", "evidence", "consensus"]
categories = ["cryptography"]

[dependencies]
eld-tendermint-p2p = { version = "0.0.1", path = "../p2p" }
eld-tendermint-proto = { version = "0.0.1", path = "../proto" }
eld-tendermint-state = { version = "0.0.1", path = "../state" }
eld-tendermint-store = { version = "0.0.1", path = "../store" }
eld-tendermint-types = { version = "0.0.1", path = "../types" }
hex = "0.4"
prost = "0.14"

[dev-dependencies]
eld-tendermint-config = { version = "0.0.1", path = "../config" }
eld-tendermint-consensus = { version = "0.0.1", path = "../consensus" }
eld-tendermint-crypto = { version = "0.0.1", path = "../crypto" }
eld-tendermint-mempool = { version = "0.0.1", path = "../mempool" }
eld-tendermint-privval = { version = "0.0.1", path = "../privval" }

[lints]
workspace = true
