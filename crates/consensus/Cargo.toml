[package]
name = "eld-tendermint-consensus"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Tendermint 0.34 consensus. Runs propose, prevote, and precommit, gossips on channels 0x20-0x23, and keeps a CRC32C write-ahead log."
readme = "README.md"
documentation = "https://github.com/eldnetwork/eld-tendermint-rs/blob/main/crates/consensus/README.md"
keywords = ["tendermint", "consensus", "bft"]
categories = ["algorithms", "cryptography"]

[dependencies]
eld-tendermint-config = { version = "0.0.1", path = "../config" }
eld-tendermint-evidence = { version = "0.0.1", path = "../evidence" }
eld-tendermint-p2p = { version = "0.0.1", path = "../p2p" }
eld-tendermint-mempool = { version = "0.0.1", path = "../mempool" }
eld-tendermint-privval = { version = "0.0.1", path = "../privval" }
eld-tendermint-proto = { version = "0.0.1", path = "../proto" }
eld-tendermint-state = { version = "0.0.1", path = "../state" }
eld-tendermint-store = { version = "0.0.1", path = "../store" }
eld-tendermint-types = { version = "0.0.1", path = "../types" }
crc32c = "0.6"
prost = "0.14"
prost-types = "0.14"

[dev-dependencies]
eld-tendermint-crypto = { version = "0.0.1", path = "../crypto" }

[lints]
workspace = true
