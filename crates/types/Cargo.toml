[package]
name = "eld-tendermint-types"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Tendermint 0.34 blocks, votes, validators, and genesis. ValidateBasic, header hashes, and canonical sign bytes."
readme = "README.md"
documentation = "https://github.com/eldnetwork/eld-tendermint-rs/blob/main/crates/types/README.md"
keywords = ["tendermint", "blockchain", "consensus"]
categories = ["data-structures", "cryptography"]

[dependencies]
eld-tendermint-crypto = { version = "0.0.1", path = "../crypto" }
eld-tendermint-proto = { version = "0.0.1", path = "../proto" }
hex = "0.4"
prost = "0.14"
prost-types = "0.14"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
proptest = { version = "1.6.0", default-features = false, features = ["std"] }

[lints]
workspace = true
