[package]
name = "eld-tendermint-p2p"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Tendermint 0.34 node key, secret connection, switch, address book, and PEX."

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
eld-tendermint-crypto = { version = "0.0.1", path = "../crypto" }
eld-tendermint-proto = { version = "0.0.1", path = "../proto" }
eld-tendermint-types = { version = "0.0.1", path = "../types" }
hex = "0.4"
hkdf = "0.12"
merlin = "3"
prost = { version = "0.13", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x25519-dalek = "2"

[dev-dependencies]
eld-tendermint-crypto = { version = "0.0.1", path = "../crypto" }
eld-tendermint-proto = { version = "0.0.1", path = "../proto" }
prost = "0.13"

[lints]
workspace = true
