[package]
name = "eld-tendermint-p2p"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Tendermint 0.34 peer networking. Node key, secret-connection handshake, multiplexed switch, address book, and peer exchange on channel 0x00."
readme = "README.md"
documentation = "https://github.com/eldnetwork/eld-tendermint-rs/blob/main/crates/p2p/README.md"
keywords = ["tendermint", "p2p", "networking"]
categories = ["network-programming", "cryptography"]

[dependencies]
base64 = "0.23"
chacha20poly1305 = "0.11"
eld-tendermint-crypto = { version = "0.0.1", path = "../crypto" }
eld-tendermint-proto = { version = "0.0.1", path = "../proto" }
eld-tendermint-types = { version = "0.0.1", path = "../types" }
hex = "0.4"
hkdf = "0.13"
merlin = "3"
prost = { version = "0.14", features = ["derive"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
x25519-dalek = "3"

[dev-dependencies]
eld-tendermint-crypto = { version = "0.0.1", path = "../crypto" }
eld-tendermint-proto = { version = "0.0.1", path = "../proto" }
prost = "0.14"

[lints]
workspace = true
