[package]
name = "eld-tendermint-store"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Tendermint 0.34 block store on RocksDB. Keys match the Go block store. A goleveldb data directory is refused."
readme = "README.md"
documentation = "https://github.com/eldnetwork/eld-tendermint-rs/blob/main/crates/store/README.md"
keywords = ["tendermint", "blockchain", "rocksdb"]
categories = ["database"]

[dependencies]
eld-tendermint-proto = { version = "0.0.1", path = "../proto" }
eld-tendermint-types = { version = "0.0.1", path = "../types" }
hex = "0.4"
prost = "0.14"
# Compression codecs are off so the build does not need system snappy/lz4/zstd.
# bindgen-runtime uses the crate's pregenerated bindings.
rocksdb = { version = "0.25", default-features = false, features = ["bindgen-runtime"] }

[lints]
workspace = true
