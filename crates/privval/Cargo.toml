[package]
name = "eld-tendermint-privval"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Tendermint 0.34 file privval and a dialer for a remote signer."

[dependencies]
eld-tendermint-crypto = { version = "0.0.1", path = "../crypto" }
eld-tendermint-p2p = { version = "0.0.1", path = "../p2p" }
eld-tendermint-proto = { version = "0.0.1", path = "../proto" }
eld-tendermint-types = { version = "0.0.1", path = "../types" }
hex = "0.4"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
eld-tendermint-crypto = { version = "0.0.1", path = "../crypto" }
eld-tendermint-p2p = { version = "0.0.1", path = "../p2p" }
eld-tendermint-proto = { version = "0.0.1", path = "../proto" }
eld-tendermint-types = { version = "0.0.1", path = "../types" }
hex = "0.4"
prost = "0.13"

[lints]
workspace = true
