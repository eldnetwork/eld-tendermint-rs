[package]
name = "eld-tendermint-crypto"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Tendermint 0.34 tmhash, RFC-6962 Merkle inclusion proofs, Ed25519 sign and verify, and Amino JSON for keys."
readme = "README.md"
documentation = "https://github.com/eldnetwork/eld-tendermint-rs/blob/main/crates/crypto/README.md"
keywords = ["tendermint", "ed25519", "merkle", "amino"]
categories = ["cryptography"]

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
eld-tendermint-proto = { version = "0.0.1", path = "../proto" }
rand = "0.8"
sha2 = "0.10"

[dev-dependencies]
hex = "0.4"

[lints]
workspace = true
