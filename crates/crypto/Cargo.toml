[package]
name = "eld-tendermint-crypto"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Tendermint 0.34 tmhash, Merkle roots, Ed25519 key bytes, and Amino JSON."

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
eld-tendermint-proto = { version = "0.0.1", path = "../proto" }
rand = "0.8"
sha2 = "0.10"

[dev-dependencies]
hex = "0.4"

[lints]
workspace = true
