[package]
name = "eld-tendermint-blockchain"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Tendermint 0.34 v0 fast sync. Asks a taller peer for up to 20 blocks on channel 0x40 and applies each block at the next height."
readme = "README.md"
documentation = "https://github.com/eldnetwork/eld-tendermint-rs/blob/main/crates/blockchain/README.md"
keywords = ["tendermint", "blockchain", "fast-sync"]
categories = ["network-programming"]

[dependencies]
eld-tendermint-p2p = { version = "0.0.1", path = "../p2p" }
eld-tendermint-proto = { version = "0.0.1", path = "../proto" }
eld-tendermint-state = { version = "0.0.1", path = "../state" }
eld-tendermint-store = { version = "0.0.1", path = "../store" }
eld-tendermint-types = { version = "0.0.1", path = "../types" }
prost = "0.14"

[dev-dependencies]
eld-tendermint-crypto = { version = "0.0.1", path = "../crypto" }

[lints]
workspace = true
