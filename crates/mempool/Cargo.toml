[package]
name = "eld-tendermint-mempool"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Tendermint 0.34 v0 FIFO mempool. Checks transactions, reaps them in arrival order, rechecks, and gossips one transaction per message on channel 0x30."
readme = "README.md"
documentation = "https://github.com/eldnetwork/eld-tendermint-rs/blob/main/crates/mempool/README.md"
keywords = ["tendermint", "mempool", "blockchain"]
categories = ["network-programming"]

[dependencies]
eld-tendermint-config = { version = "0.0.1", path = "../config" }
eld-tendermint-p2p = { version = "0.0.1", path = "../p2p" }
eld-tendermint-proto = { version = "0.0.1", path = "../proto" }
eld-tendermint-types = { version = "0.0.1", path = "../types" }
prost = "0.14"

[dev-dependencies]
eld-tendermint-crypto = { version = "0.0.1", path = "../crypto" }

[lints]
workspace = true
