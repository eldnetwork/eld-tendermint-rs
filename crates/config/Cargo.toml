[package]
name = "eld-tendermint-config"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Tendermint 0.34 config.toml and genesis.json loaders. Parsing starts from the Go defaults and overlays the file."
readme = "README.md"
documentation = "https://github.com/eldnetwork/eld-tendermint-rs/blob/main/crates/config/README.md"
keywords = ["tendermint", "config", "genesis"]
categories = ["config"]

[[bin]]
name = "eld-tendermint-config"
path = "src/bin/show.rs"

[dependencies]
eld-tendermint-types = { version = "0.0.1", path = "../types" }
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
eld-tendermint-types = { version = "0.0.1", path = "../types" }
hex = "0.4"

[lints]
workspace = true
