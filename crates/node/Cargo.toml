[package]
name = "eld-tendermint-node"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Tendermint 0.34 node binary. Runs consensus, the mempool, the evidence pool, peer exchange, and v0 fast sync, and serves JSON-RPC health, status, genesis, validators, blockchain, net_info, consensus_state, broadcast_tx_sync, broadcast_tx_async, broadcast_tx_commit, abci_query, block, commit, tx, and tx_search."
readme = "README.md"
documentation = "https://github.com/eldnetwork/eld-tendermint-rs/blob/main/crates/node/README.md"
keywords = ["tendermint", "consensus", "blockchain", "abci", "json-rpc"]
categories = ["cryptography", "network-programming"]

[[bin]]
name = "eld-tendermint"
path = "src/main.rs"

[dependencies]
eld-tendermint-abci = { version = "0.0.1", path = "../abci" }
eld-tendermint-blockchain = { version = "0.0.1", path = "../blockchain" }
eld-tendermint-config = { version = "0.0.1", path = "../config" }
eld-tendermint-consensus = { version = "0.0.1", path = "../consensus" }
eld-tendermint-evidence = { version = "0.0.1", path = "../evidence" }
eld-tendermint-crypto = { version = "0.0.1", path = "../crypto" }
eld-tendermint-mempool = { version = "0.0.1", path = "../mempool" }
eld-tendermint-p2p = { version = "0.0.1", path = "../p2p" }
eld-tendermint-privval = { version = "0.0.1", path = "../privval" }
eld-tendermint-proto = { version = "0.0.1", path = "../proto" }
eld-tendermint-state = { version = "0.0.1", path = "../state" }
eld-tendermint-store = { version = "0.0.1", path = "../store" }
eld-tendermint-types = { version = "0.0.1", path = "../types" }
base64 = "0.23"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.30"

[dev-dependencies]
base64 = "0.23"
eld-tendermint-abci = { version = "0.0.1", path = "../abci" }
eld-tendermint-config = { version = "0.0.1", path = "../config" }
eld-tendermint-crypto = { version = "0.0.1", path = "../crypto" }
eld-tendermint-mempool = { version = "0.0.1", path = "../mempool" }
eld-tendermint-p2p = { version = "0.0.1", path = "../p2p" }
eld-tendermint-privval = { version = "0.0.1", path = "../privval" }
eld-tendermint-proto = { version = "0.0.1", path = "../proto" }
eld-tendermint-types = { version = "0.0.1", path = "../types" }
serde_json = "1"

[lints]
workspace = true
