[package]
name = "eld-tendermint-node"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Tendermint 0.34 node process. Serves JSON-RPC status, health, and broadcast tx."

[[bin]]
name = "eld-tendermint"
path = "src/main.rs"

[dependencies]
eld-tendermint-abci = { path = "../abci" }
eld-tendermint-config = { path = "../config" }
eld-tendermint-consensus = { path = "../consensus" }
eld-tendermint-crypto = { path = "../crypto" }
eld-tendermint-mempool = { path = "../mempool" }
eld-tendermint-p2p = { path = "../p2p" }
eld-tendermint-privval = { path = "../privval" }
eld-tendermint-proto = { path = "../proto" }
eld-tendermint-state = { path = "../state" }
eld-tendermint-store = { path = "../store" }
eld-tendermint-types = { path = "../types" }
base64 = "0.22"
hex = "0.4"
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
eld-tendermint-abci = { path = "../abci" }
eld-tendermint-config = { path = "../config" }
eld-tendermint-crypto = { path = "../crypto" }
eld-tendermint-mempool = { path = "../mempool" }
eld-tendermint-p2p = { path = "../p2p" }
eld-tendermint-privval = { path = "../privval" }
eld-tendermint-proto = { path = "../proto" }
eld-tendermint-types = { path = "../types" }
serde_json = "1"
