[package]
name = "eld-tendermint-state"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Tendermint 0.34 chain state. Builds genesis state, calls InitChain once, applies blocks, and indexes committed transactions."
readme = "README.md"
documentation = "https://github.com/eldnetwork/eld-tendermint-rs/blob/main/crates/state/README.md"
keywords = ["tendermint", "blockchain", "state"]
categories = ["cryptography"]

[dependencies]
eld-tendermint-crypto = { version = "0.0.1", path = "../crypto" }
eld-tendermint-proto = { version = "0.0.1", path = "../proto" }
eld-tendermint-store = { version = "0.0.1", path = "../store" }
eld-tendermint-types = { version = "0.0.1", path = "../types" }
prost = "0.13"
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
