syntax = "proto3";
package tendermint.types;

option go_package = "github.com/tendermint/tendermint/proto/tendermint/types";

import "tendermint/types/params.proto";
import "tendermint/types/types.proto";
import "tendermint/types/validator.proto";

// Eld chain summary. Not part of upstream Tendermint.
//
// summary_hash is the tmhash of this message encoded with summary_hash empty,
// so the digest covers body_hash and every other field.
message SummaryHeader {
  int64 end_height = 1;
  bytes summary_hash = 2;
  BlockID last_block_id = 3;
  bytes last_results_hash = 4;
  bytes app_hash = 5;
  bytes body_hash = 6;
  bytes validators_hash = 7;
  bytes next_validators_hash = 8;
  bytes consensus_hash = 9;
  int64 last_height_validators_changed = 10;
  int64 last_height_consensus_params_changed = 11;
  ValidatorSet validators = 12;
  ValidatorSet next_validators = 13;
  ConsensusParams consensus_params = 14;
}

// Compressed application-state snapshot. body_hash is the tmhash of these bytes.
// After zstd decompression the bytes are an AppStateSnapshot.
message SummaryBody {
  bytes state_snapshot = 1;
}

// Application state carried in SummaryBody.state_snapshot after decompression.
// The Tendermint node and the ABCI app both decode this message.
// Record values are opaque application bytes.
message AppStateSnapshot {
  int64 block_height = 1;
  bytes app_hash = 2;
  string chain_id = 3;
  int64 current_epoch = 4;
  bytes state_trie_root = 5;
  int64 frontier = 6;
  repeated AppStateRecord records = 7;
  repeated int64 epoch_heights = 8;
  repeated AppNamespace namespaces = 9;
  repeated AppValidator validators = 10;
  repeated AppValidator active_validators = 11;
  repeated AppCapacityValidator capacity_validators = 12;
  optional AppActiveCapacityValidator active_capacity_validator = 13;
}

message AppStateRecord {
  bytes key = 1;
  bytes value = 2;
}

message AppNamespace {
  string namespace_slug = 1;
  bytes owner = 2;
  uint64 registered_height = 3;
}

message AppValidator {
  bytes address = 1;
  // Decimal stake amount.
  string stake = 2;
  bytes public_key = 3;
}

message AppCapacityValidator {
  bytes address = 1;
  string stake = 2;
  bytes public_key = 3;
  uint64 storage_capacity = 4;
  optional bytes merkle_root = 5;
  optional bytes seed = 6;
  optional uint32 chunk_count = 7;
  optional uint64 registered_at = 8;
  optional uint64 last_merkle_root_update = 9;
  uint64 registered_block = 10;
  uint64 registration_duration = 11;
}

message AppActiveCapacityValidator {
  bytes validator_address = 1;
  int64 epoch = 2;
  repeated bytes challenged_providers = 3;
  repeated string subscribed_topics = 4;
}
